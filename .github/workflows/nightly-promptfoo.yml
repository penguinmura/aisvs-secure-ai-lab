name: "Nightly Promptfoo Adversarial Test"

on:
  schedule:
    - cron: '0 2 * * *' # 毎日午前2時実行
  workflow_dispatch:

permissions:
  id-token: write # AWS OIDC 昇格用権限
  contents: read

jobs:
  promptfoo-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS Credentials via OIDC (Keyless)
        continue-on-error: true # AWS 準備前の初期検証時は警告を出してビルドを通過させる
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          audience: sts.amazonaws.com

      - name: Run promptfoo Red Team Scan via AWS Bedrock (No Static API Keys)
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}" ]; then
            echo "⚠️ AWS OIDC Role is not configured yet. Skipping Bedrock live test for initial setup."
            exit 0
          fi
          npx promptfoo@latest redteam run --config promptfooconfig.yaml --no-progress-bar
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
