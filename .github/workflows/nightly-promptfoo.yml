name: Nightly Promptfoo Adversarial Test

on:
  schedule:
    # GitHub ActionsのcronはUTC。
    # JSTの午前2時に実行する場合は、前日の17:00 UTC。
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  promptfoo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::AWS_ROLE_ARN is not configured."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          audience: sts.amazonaws.com
          role-session-name: promptfoo-nightly
          role-duration-seconds: 10800

      - name: Verify AWS credentials
        run: |
          aws sts get-caller-identity
          aws configure list

      - name: Run Promptfoo Red Team Scan via AWS Bedrock
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
        run: |
          npx promptfoo@latest redteam run \
            --config promptfooconfig.yaml \
            --no-progress-bar
